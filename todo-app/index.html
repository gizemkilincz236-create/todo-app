<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List (Yapılacaklar Listesi)</title>
    <style>
        /* CSS: Sayfanın şık ve modern görünmesini sağlar */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .todo-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
        }
        button {
            padding: 10px 15px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #27ae60;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 12px;
            background: #f9f9f9;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #3498db;
        }
        .delete-btn {
            background-color: #e74c3c;
            padding: 5px 10px;
            font-size: 12px;
        }
        .delete-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div class="todo-container">
        <h2>Yapılacaklar Listesi</h2>
        
        <div class="input-area">
            <input type="text" id="todoInput" placeholder="Yeni bir görev ekle...">
            <button onclick="newElement()">Ekle</button>
        </div>

        <ul id="todoList">
            </ul>
    </div>

    <script>
        // JavaScript: Sayfaya dinamik işlevsellik katar
        function newElement() {
            var li = document.createElement("li");
            var inputValue = document.getElementById("todoInput").value;
            var t = document.createTextNode(inputValue);
            li.appendChild(t);

            if (inputValue === '') {
                alert("Lütfen boş bırakmayın!");
            } else {
                document.getElementById("todoList").appendChild(li);
            }
            document.getElementById("todoInput").value = "";

            // Silme butonu oluşturma
            var span = document.createElement("button");
            var txt = document.createTextNode("Sil");
            span.className = "delete-btn";
            span.appendChild(txt);
            li.appendChild(span);

            // Silme butonuna basınca görevi kaldırma
            span.onclick = function() {
                var div = this.parentElement;
                div.style.display = "none";
            }
        }

        // Enter tuşuna basınca da ekleme yapabilmesi için:
        document.getElementById("todoInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                newElement();
            }
        });
    </script>

</body>
</html>
